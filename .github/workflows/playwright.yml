name: CI

# The public demo site blocks automated traffic coming from cloud CI runners,
# so this pipeline validates the framework itself (types, step bindings, test
# discovery). The full API + E2E suite runs locally — see README.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Type check + scenario validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Generate specs from Gherkin (fails on any unbound step)
        run: npx bddgen

      - name: Discover all tests
        run: npx playwright test --list --project=api --project=chromium --project=firefox
